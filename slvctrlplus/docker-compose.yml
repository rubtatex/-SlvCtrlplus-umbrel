# SlvCtrl+ — personal/community Umbrel package.
#
# umbrelOS's app installer only PULLS images, it does not build Dockerfiles
# itself — a compose file with `build:` and no `image:` fails during
# `app-script install` (docker-compose "pull" has nothing to fetch). Neither
# slvctrlplus-server nor slvctrlplus-frontend publish an official image, so
# ../.github/workflows/build-images.yml builds server/Dockerfile and
# frontend/Dockerfile for linux/amd64+linux/arm64 and pushes them to GHCR;
# this file just references the result.
#
# >>> REPLACE "OWNER" BELOW with your GitHub username/org (lowercase) once
#     you've pushed this repo and the Action has run at least once, and make
#     sure both packages are set to Public visibility on GitHub (Profile/Org
#     -> Packages) — umbrelOS pulls anonymously, without credentials.

services:

  # Umbrel's reverse proxy. Routes the app's main page (manifest `port`) to
  # the frontend's nginx on its internal port 80.
  app_proxy:
    environment:
      APP_HOST: slvctrlplus_frontend_1
      APP_PORT: 80

  # Static frontend (Vue app), served by nginx. Unprivileged, no host access.
  frontend:
    image: ghcr.io/OWNER/slvctrlplus-frontend:latest
    restart: on-failure

  # Node.js backend. The frontend's Settings screen stores the backend URL
  # in the browser's own localStorage and talks to it directly over REST +
  # Socket.IO — it does NOT go through app_proxy/nginx. So this service
  # needs to be reachable on its own, fixed port: enter
  # "http://<umbrel-ip-or-hostname>:1337" in that Settings screen after
  # first install.
  server:
    image: ghcr.io/OWNER/slvctrlplus-server:latest
    restart: on-failure
    # network_mode: host + privileged: true together reproduce the same
    # hardware access the upstream install-rpi.sh script gets when it runs
    # directly on the Pi:
    #   - privileged: true   -> lets the container see host device nodes
    #                           (USB-serial adapters, GPIO UART, generic USB)
    #   - network_mode: host -> Bluetooth LE (noble/buttplug) talks to BlueZ
    #                           over the host's D-Bus/HCI socket, which
    #                           Docker cannot bridge into an isolated network
    #                           namespace
    # This is broader host access than a typical Umbrel app and is only
    # justified because SlvCtrl+'s whole purpose is talking to local
    # hardware. If you only ever use a USB-serial adapter and never
    # Bluetooth, you can replace both lines with:
    #   privileged: true
    #   volumes:
    #     - ${APP_DATA_DIR}/data:/data
    #     - /run/udev:/run/udev:ro
    #   ports:
    #     - "1337:1337/tcp"
    network_mode: host
    privileged: true
    environment:
      PORT: "1337"
      LOG_LEVEL: "info"
      DATA_PATH: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /run/udev:/run/udev:ro
      - /var/run/dbus:/var/run/dbus
