<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Plug body -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- two prongs -->
    <line x1="104" y1="56" x2="104" y2="96"/>
    <line x1="152" y1="56" x2="152" y2="96"/>
    <!-- plug housing -->
    <rect x="84" y="96" width="88" height="56" rx="16"/>
    <!-- cable down to control dot -->
    <path d="M128 152 V176 C128 192 142 200 158 196"/>
  </g>

  <!-- control / signal dot at the end of the cable -->
  <circle cx="176" cy="196" r="14" fill="#FFFFFF"/>

  <!-- signal pulses -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round">
    <path d="M198 196 q6 -18 0 -36" opacity="0.85"/>
    <path d="M214 192 q12 -22 0 -46" opacity="0.55"/>
  </g>
</svg>
